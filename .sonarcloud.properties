# SonarCloud Automatic Analysis configuration.
# Automatic Analysis does not read sonar-project.properties — scope settings
# for it live in this file instead. Keep the two lists in sync.
#
# Rationale (same as sonar-project.properties):
# - tokens.css, tokens-data.js and the generated platform theme files are
#   emitted by scripts/generate.mjs; every colour role has the same shape, so
#   they read as "duplicated" even though they are generated artifacts.
# - components/*/card.html specimens are intentionally self-contained: each
#   repeats the same head/boilerplate so a card renders standalone.
# - prototypes/web/primitives.jsx deliberately mirrors the components/*/*.jsx
#   markup — it is the no-build bridge for the prototype.
# Copy-paste detection only; bug and code-smell analysis still runs on them.
sonar.cpd.exclusions=tokens.css,tokens-data.js,platforms/charm/jylhis/palette.go,platforms/gtk/gtk.css,platforms/waybar/style.css,components/*/card.html,prototypes/web/primitives.jsx

# ── Generated GTK stylesheets are not web CSS ────────────────────────
# platforms/gtk/gtk.css and platforms/waybar/style*.css are GTK CSS, not
# browser CSS. They are emitted by scripts/generate.mjs and use GTK widget
# type selectors (`window#waybar`, `menu`, `headerbar`) that the CSS analyzer
# reports as "Unknown type selector" (css:S4670) because they are not HTML
# elements. The selectors are correct for their target — Waybar's own docs use
# `window#waybar` — so the rule structurally cannot apply here. These files are
# fully generated and are already covered by `bun scripts/validate-a11y-css.mjs`
# and `bun scripts/generate.mjs --check`.
sonar.exclusions=platforms/gtk/gtk.css,platforms/waybar/style.css,platforms/waybar/style-sheet.css
