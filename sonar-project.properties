# SonarCloud (SonarQube Cloud) analysis configuration.
#
# tokens.css and tokens-data.js — and the generated platform theme files — are
# emitted by scripts/generate.mjs from tokens.json. Every colour role has the
# same shape, so these outputs read as heavily "duplicated" even though they are
# generated artifacts, not hand-authored source. Exclude the generated outputs
# from copy-paste detection only; bug and code-smell analysis still runs on them.
# components/*/card.html specimens are intentionally self-contained: each
# repeats the same head/boilerplate so a card renders standalone (like the
# preview/ cards). prototypes/web/primitives.jsx deliberately mirrors the
# components/*/*.jsx markup — it is the no-build bridge for the prototype and
# documents "keep in sync with the component sources" at the top.
sonar.cpd.exclusions=tokens.css,tokens-data.js,platforms/charm/jylhis/palette.go,platforms/gtk/gtk.css,platforms/waybar/style.css,components/*/card.html,prototypes/web/primitives.jsx
