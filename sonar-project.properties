# SonarCloud (SonarQube Cloud) analysis configuration.
#
# Key convention and the matching sonarcloud_project resource live in
# infrastructure/sonarcloud.tf; both halves are required (the workflow scans a
# directory because this file exists, the scanner needs the project to exist).
sonar.projectKey=jylhis_design
sonar.organization=jylhis

sonar.sources=.

# tokens.css and tokens-data.js — and the generated platform theme files — are
# emitted by scripts/generate.mjs from tokens.json. Every colour role has the
# same shape, so these outputs read as heavily "duplicated" even though they are
# generated artifacts, not hand-authored source. Exclude the generated outputs
# from copy-paste detection only; bug and code-smell analysis still runs on them.
# components/*/card.html specimens are intentionally self-contained: each
# repeats the same head/boilerplate so a card renders standalone (like the
# preview/ cards). prototypes/web/primitives.jsx deliberately mirrors the
# components/*/*.jsx markup — it is the no-build bridge for the prototype and
# documents "keep in sync with the component sources" at the top.
sonar.cpd.exclusions=tokens.css,tokens-data.js,platforms/charm/jylhis/palette.go,platforms/gtk/gtk.css,platforms/waybar/style.css,components/*/card.html,prototypes/web/primitives.jsx

# ── Generated GTK stylesheets are not web CSS ────────────────────────
# platforms/gtk/gtk.css and platforms/waybar/style*.css are GTK CSS, not
# browser CSS. They are emitted by scripts/generate.mjs and use GTK widget
# type selectors (`window#waybar`, `menu`, `headerbar`) that the CSS analyzer
# reports as "Unknown type selector" (css:S4670) because they are not HTML
# elements. The selectors are correct for their target — Waybar's own docs use
# `window#waybar` — so the rule structurally cannot apply here. These files are
# fully generated and are already covered by `bun scripts/validate-a11y-css.mjs`
# and `bun scripts/generate.mjs --check`.
sonar.exclusions=platforms/gtk/gtk.css,platforms/waybar/style.css,platforms/waybar/style-sheet.css

sonar.sourceEncoding=UTF-8
