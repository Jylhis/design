# Jylhis Hyprland config
# ~/.config/hypr/jylhis.conf  (source this from hyprland.conf)
#
# Earth-toned borders, accent-on-focus, medium gaps (breathing but efficient),
# motion tokens from tokens.md §6. Keyboard primitives live in platforms/KEYBOARD.md.

# ──────────────────────────────────────────────────────────────
# COLORS — set both, source the one you want from hyprland.conf
#
# source = ~/.config/hypr/jylhis-roast.conf     # dark  (default)
# source = ~/.config/hypr/jylhis-paper.conf     # light
# ──────────────────────────────────────────────────────────────

# ── Layout ──
general {
    gaps_in  = 6
    gaps_out = 12
    border_size = 2

    # col.active_border / col.inactive_border set per-theme file below.

    resize_on_border = true
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

dwindle {
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

# ── Motion (tokens.md §6) ──
animations {
    enabled = true

    # Bezier curves named per token
    bezier = fast,   0.25, 0.1, 0.25, 1.0
    bezier = base,   0.2, 0.6, 0.2, 1.0
    bezier = slow,   0.16, 1.0, 0.3, 1.0
    bezier = spring, 0.34, 1.25, 0.64, 1.0

    # Functional, not decorative.
    animation = windows,       1, 2.5, base, popin 90%
    animation = windowsOut,    1, 1.5, fast, popin 98%
    animation = border,        1, 2.0, base
    animation = borderangle,   0                    # off (decorative)
    animation = fade,          1, 1.5, fast
    animation = workspaces,    1, 2.5, slow, slidefade 12%
    animation = specialWorkspace, 1, 3.0, spring, slidefadevert -20%
}

# ── Decoration ──
decoration {
    rounding = 4           # matches CSS --radius-md

    # Dim inactive instead of a heavy shadow — paper metaphor.
    dim_inactive = true
    dim_strength = 0.08

    # Tiny shadow, warm not black
    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 2
    shadow_offset = 0 2
    # shadow color set per theme (warmer than plain black)

    # Blur only on special-workspace / rofi — off by default (performance)
    blur {
        enabled = false
    }
}

# ── Input ──
input {
    kb_layout  = us,fi
    kb_options = grp:alt_shift_toggle,caps:escape   # Caps as ESC — key to our keyboard model
    repeat_rate  = 40
    repeat_delay = 280
    follow_mouse = 2       # focus without raise
    accel_profile = flat
    sensitivity = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    focus_on_activate = false
}

# ── Keybinds ── (see platforms/KEYBOARD.md §"Shortcuts canonical bindings")
$mod = SUPER

# The primitives
bind = $mod,        d,      exec, rofi -show combi -show-icons         # command palette
bind = $mod,        Return, exec, ghostty
bind = $mod,        b,      exec, chromium
bind = $mod,        e,      exec, emacsclient -c -a emacs
bind = $mod,        q,      killactive
bind = $mod SHIFT,  q,      exit
bind = $mod SHIFT,  t,      exec, ~/.local/bin/jylhis-toggle-theme      # light ↔ dark everywhere

# Window focus — Emacs-ish hjkl (also arrows)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

# Move
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Splits
bind = $mod,       v, togglesplit
bind = $mod,       f, fullscreen, 1
bind = $mod SHIFT, f, fullscreen, 0
bind = $mod,       space, togglefloating

# Which-key style leader cheatsheet (bound to $mod+?)
bind = $mod, slash, exec, ~/.local/bin/jylhis-cheatsheet

# Screenshot — copper accent tone on capture (sound token: sound-tap)
bind = ,     Print, exec, grim -g "$(slurp)" - | wl-copy && canberra-gtk-play -i bell

# ── Window rules ──
windowrulev2 = float,        class:^(rofi)$
windowrulev2 = center,       class:^(rofi)$
windowrulev2 = float,        class:^(jylhis-cheatsheet)$
windowrulev2 = pin,          class:^(jylhis-cheatsheet)$
windowrulev2 = noanim,       class:^(rofi)$     # palette opens instant
