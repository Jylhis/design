# Jylhis Paper (light) border colors for Hyprland
# source this from hyprland.conf when in light mode.

general {
    col.active_border   = rgba(9a5a2aff) rgba(b5703cff) 45deg  # accent → brand
    col.inactive_border = rgba(b0a898aa)                       # border-strong, soft
}

decoration {
    col.shadow          = rgba(2c2825aa)   # text tone, not pure black
    col.shadow_inactive = rgba(2c282544)
}

misc {
    background_color = 0xfaf7f2            # paper
}
