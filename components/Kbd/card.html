<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Kbd</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.exports = {}; window.require = () => window.exports;</script>
<style>
  html, body { margin: 0; background: var(--color-bg); }
  body { padding: 20px 22px; color: var(--color-text); }
  .demo-label { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin: 0 0 8px; }
  .demo-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .demo-col { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react" src="./Kbd.jsx"></script>
<script type="text/babel" data-presets="env,react">
const h = React.createElement;

const { Kbd } = window.exports;
ReactDOM.createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h("span", { className: "demo-label" }, "single · chord"),
    h("div", { className: "demo-row", style: { fontFamily: "var(--font-body)", fontSize: "14px" } },
      h("span", null, "Press ", h(Kbd, null, "/"), " to search"),
      h(Kbd, { keys: ["g", "t"] })
    ),
    h("span", { className: "demo-label" }, "accent · the canonical shortcut on the page"),
    h("div", { className: "demo-row" },
      h(Kbd, { keys: ["⌘", "⏎"], accent: true })
    )
  )
);
</script>
</body></html>
