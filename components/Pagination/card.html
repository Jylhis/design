<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Pagination</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.exports = {}; window.require = () => window.exports;</script>
<style>
  html, body { margin: 0; background: var(--color-bg); }
  body { padding: 20px 22px; color: var(--color-text); }
  .demo-label { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin: 18px 0 8px; }
  .demo-label:first-child { margin-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react" src="./Pagination.jsx"></script>
<script type="text/babel" data-presets="env,react">
const h = React.createElement;
const { Pagination } = window.exports;

ReactDOM.createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h("span", { className: "demo-label" }, "current = 4 · gaps · aria-current"),
    h(Pagination, { page: 4, pageCount: 12 }),
    h("span", { className: "demo-label" }, "first page · prev disabled"),
    h(Pagination, { page: 1, pageCount: 5 })
  )
);
</script>
</body></html>
