<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Jylhis — website kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <style>
    /* ——— Layout + page chrome, mirrored from jylhis.com ——— */
    html, body { margin:0; background: var(--color-bg); }
    body { color: var(--color-text); }
    a { color: var(--color-accent); text-decoration: none; cursor: pointer;
        background-image: linear-gradient(var(--color-accent), var(--color-accent));
        background-repeat: no-repeat; background-position: 0% 100%; background-size: 0% 1px;
        transition: background-size var(--transition-base), color var(--transition-fast); }
    a:hover { color: var(--color-accent-hover); background-size: 100% 1px; }
    nav a, footer a, .nav-col a, .breadcrumb a, .contact-links a, .rss-link, .currently-list a, .tag, .project-name, .project-github-link, .tree-item a, .note-title { background-image: none !important; }

    main { animation: page-enter var(--transition-slow); }
    @keyframes page-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .page-content { max-width: 48rem; margin: 0 auto; padding: var(--space-xl) var(--layout-padding-mobile) var(--space-3xl); }

    /* Header */
    .site-header { display:flex; justify-content:space-between; align-items:center; padding: var(--space-xl) var(--layout-padding-mobile); font-family: var(--font-mono); max-width: 48rem; margin: 0 auto; }
    .site-wordmark-group { display:flex; align-items:center; gap: var(--space-sm); text-decoration:none; }
    .makers-mark { width: 1.8rem; height: 1.8rem; color: var(--color-accent); display:inline-flex; }
    .wordmark { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; color: var(--color-text-heading); letter-spacing: 0.02em; }
    .header-right { display:flex; align-items:center; gap: 0.75rem; }
    .breadcrumb { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-muted); display:flex; align-items:center; }
    .breadcrumb .sep { opacity: 0.5; margin: 0 0.4em; }
    .breadcrumb .current { color: var(--color-text); }
    .search-trigger { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 3px; padding: 0.3rem 0.6rem; cursor: pointer; font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-text-muted); display:flex; gap: 0.4rem; align-items:center; }
    .search-trigger:hover { color: var(--color-accent); border-color: var(--color-accent); }
    .search-trigger kbd { font-size: 0.65rem; padding: 0.1rem 0.35rem; border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-bg); color: var(--color-text-faint); font-family: var(--font-mono); }
    .theme-toggle { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 50%; width: 2rem; height: 2rem; cursor: pointer; font-size: 0.9rem; color: var(--color-text-muted); display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); }
    .theme-toggle:hover { color: var(--color-accent); border-color: var(--color-accent); }

    /* Typography */
    body { font-family: var(--font-body); font-size: 1.125rem; line-height: 1.65; }
    h1, h2, h3, h4 { font-family: var(--font-heading); line-height: 1.25; letter-spacing: 0.01em; color: var(--color-text-heading); margin: 0; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: var(--space-lg); }
    h2 { font-size: 1.4rem; font-weight: 600; margin: var(--space-2xl) 0 var(--space-md); }
    h3 { font-size: 1.15rem; font-weight: 600; margin: var(--space-xl) 0 0.75rem; }
    p { margin-bottom: var(--space-lg); }
    .subtitle { font-size: 1.05rem; color: var(--color-text-muted); font-style: italic; margin-top: calc(-1 * var(--space-md)); margin-bottom: var(--space-2xl); }
    :not(pre) > code { font-family: var(--font-mono); font-size: 0.85em; background: var(--color-code-bg); color: var(--color-code-text); border: 1px solid var(--color-code-border); border-radius: 3px; padding: 0.1em 0.3em; }

    /* Home */
    .home-intro { margin-top: var(--space-xl); }
    .headline { font-size: 1.6rem; margin-bottom: var(--space-sm); }
    .role { font-family: var(--font-mono); font-size: 0.85rem; color: var(--color-text-muted); letter-spacing: 0.02em; margin-bottom: var(--space-sm); }
    .tagline { font-size: 1.05rem; color: var(--color-text-muted); margin-bottom: var(--space-xl); line-height: 1.6; }
    .home-greeting p { font-size: 1.15rem; line-height: 1.7; margin-bottom: var(--space-md); }
    .currently-box { background: var(--color-bg-subtle); border-left: 3px solid var(--color-accent); border-radius: 0 4px 4px 0; padding: var(--space-lg); margin-top: var(--space-2xl); }
    .currently-label { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 400; text-transform: lowercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin-bottom: 0.75rem; }
    .currently-list { list-style: none; padding: 0; margin: 0; }
    .currently-list li { font-size: 0.95rem; padding: 0.3rem 0 0.3rem 1.5em; position: relative; }
    .currently-list li::before { content: '›'; position: absolute; left: 0; color: var(--color-accent); font-family: var(--font-mono); }
    .contact-links { margin-top: var(--space-2xl); display:flex; gap: var(--space-lg); font-family: var(--font-mono); font-size: 0.85rem; }
    .contact-links a { color: var(--color-text-muted); }
    .contact-links a:hover { color: var(--color-accent); }

    /* Notes */
    .notes-list { list-style: none; padding: 0; margin: 0; }
    .note-item { display: grid; grid-template-columns: 7rem 1fr; gap: var(--space-lg); padding: var(--space-md) 0; border-bottom: 1px solid var(--color-border); cursor: pointer; color: inherit; text-decoration: none; }
    .notes-list li:first-child .note-item { border-top: 1px solid var(--color-border); }
    .note-item:hover { background: var(--color-bg-subtle); }
    .note-item:focus-visible,
    .project-entry:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .note-date { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-muted); padding-top: 0.15em; }
    .note-title { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; color: var(--color-text-heading); cursor: pointer; }
    .note-title:hover { color: var(--color-accent); }
    .note-excerpt { font-size: 0.9rem; color: var(--color-text-muted); margin: var(--space-xs) 0; line-height: 1.5; }
    .rss-line { font-family: var(--font-mono); font-size: 0.78rem; color: var(--color-text-muted); margin-bottom: var(--space-2xl); }
    .rss-link { color: var(--color-text-muted); }

    /* Tags */
    .tag-list { list-style: none; padding: 0; margin: var(--space-xs) 0 0; display:flex; flex-wrap:wrap; gap: var(--space-sm); }
    .tag { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.15em 0.55em; border-radius: 3px; background: var(--color-bg-subtle); border: 1px solid var(--color-border); color: var(--color-text-muted); }
    .tag:hover { color: var(--color-accent); border-color: var(--color-accent); }

    /* Projects */
    .terminal-prompt { font-family: var(--font-mono); font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: var(--space-xl); }
    .prompt-char { color: var(--color-accent); margin-right: 0.5em; }
    .projects-list { display:flex; flex-direction: column; gap: var(--space-xl); }
    .project-entry { display: block; padding: var(--space-lg); background: var(--color-bg-subtle); border-radius: 4px; border: 1px solid transparent; cursor: pointer; transition: border-color var(--transition-fast), background var(--transition-fast); color: inherit; text-decoration: none; }
    .project-entry:hover { border-color: var(--color-border); background: var(--color-surface); }
    .project-header { font-family: var(--font-mono); font-size: 0.8rem; display: flex; gap: var(--space-md); align-items: baseline; margin-bottom: var(--space-sm); flex-wrap: wrap; }
    .perms { color: var(--color-text-faint); }
    .project-name { color: var(--color-accent); font-weight: 600; font-size: 0.95rem; }
    .project-name:hover { color: var(--color-accent-hover); text-decoration: underline; }
    .project-date { color: var(--color-text-faint); margin-left: auto; }
    .project-desc { font-size: 0.95rem; margin: 0 0 var(--space-sm); line-height: 1.5; }
    .project-links { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-faint); margin-top: var(--space-sm); }
    .tree-item a { color: var(--color-text-muted); }
    .tree-item span { color: var(--color-text-muted); }

    /* Status badges */
    .project-status { font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1em 0.5em; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; margin-left: var(--space-sm); }
    .project-status--active { color: var(--color-status-ok); background: rgba(0,104,0,0.12); border: 1px solid var(--color-status-ok); }
    .project-status--archived { color: var(--color-text-muted); background: var(--color-bg-subtle); border: 1px solid var(--color-border); }
    .project-status--experimental { color: var(--color-syntax-keyword); background: rgba(83,26,182,0.12); border: 1px solid var(--color-syntax-keyword); }
    .project-status--contributed { color: var(--color-status-info); background: rgba(0,49,169,0.12); border: 1px solid var(--color-status-info); }

    /* Dividers & prose bits */
    .divider-labeled { display:flex; align-items:center; gap: var(--space-md); color: var(--color-text-muted); font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.05em; margin: var(--space-2xl) 0 var(--space-lg); text-transform: lowercase; }
    .divider-labeled::before, .divider-labeled::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
    .man-header { margin-bottom: var(--space-xl); }
    .man-label { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; color: var(--color-text-faint); text-transform: uppercase; }
    .prose { max-width: 65ch; }
    .prose blockquote { border-left: 3px solid var(--color-decorator); margin-left: 0; padding-left: var(--space-lg); color: var(--color-text-muted); font-style: italic; }
    .prose blockquote::before { content: '»'; font-family: var(--font-mono); color: var(--color-accent); font-style: normal; margin-right: 0.3em; }
    .prose hr { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2xl) 0; }
    pre { background: var(--color-code-bg); border: 1px solid var(--color-code-border); border-radius: 4px; padding: var(--space-lg); overflow-x: auto; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.6; }
    .code-block-wrap { margin: var(--space-lg) 0; }
    .code-filename { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-text-muted); background: var(--color-surface); border: 1px solid var(--color-code-border); border-bottom: none; border-radius: 4px 4px 0 0; padding: 0.4rem 1rem; display: inline-block; margin-bottom: -1px; }
    .code-block-wrap pre { border-top-left-radius: 0; margin-top: 0; }

    /* CV */
    .cv-page { font-family: var(--font-mono); counter-reset: cv-line; }
    .cv-entry { display: grid; grid-template-columns: 3.5rem 1fr; border-left: 1px solid var(--color-border); counter-increment: cv-line; }
    .cv-line-num { font-size: 0.75rem; color: var(--color-text-faint); text-align: right; padding-right: 1rem; padding-top: 0.2rem; line-height: 1.65; }
    .cv-line-num::after { content: counter(cv-line); }
    .cv-line-content { padding: 0.15rem 0 0.15rem 1rem; border-left: 1px solid var(--color-border); line-height: 1.65; font-size: 0.95rem; }
    .cv-line-content.blank { height: 1.65em; }
    .cv-role { font-family: var(--font-heading); font-weight: 600; color: var(--color-text-heading); }
    .cv-company { color: var(--color-accent); }
    .cv-date { font-size: 0.78rem; color: var(--color-text-muted); }
    .cv-desc { color: var(--color-text); font-family: var(--font-body); }
    .cv-highlight { color: var(--color-text-muted); font-family: var(--font-body); font-size: 0.88rem; padding-left: 2rem; }
    .cv-skills-line { font-size: 0.82rem; }
    .cv-skills-line .label { color: var(--color-syntax-keyword); } .cv-skills-line .bracket { color: var(--color-text-muted); } .cv-skills-line .value { color: var(--color-syntax-string); } .cv-skills-line .comma { color: var(--color-text-faint); }

    /* Footer */
    .site-footer { font-family: var(--font-mono); background: var(--color-surface); padding: var(--space-3xl); margin-top: var(--space-3xl); color: var(--color-text-muted); font-size: 0.8rem; }
    .footer-rule { color: var(--color-decorator); letter-spacing: -0.05em; overflow: hidden; white-space: nowrap; margin-bottom: var(--space-md); }
    .footer-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-xl); max-width: 50rem; margin: 0 auto var(--space-2xl); }
    .nav-heading { font-weight: 600; color: var(--color-text); font-size: 0.75rem; text-transform: lowercase; letter-spacing: 0.08em; display: block; margin-bottom: var(--space-sm); }
    .nav-col ul { list-style: none; padding: 0; margin: 0; display:flex; flex-direction: column; gap: var(--space-xs); }
    .nav-col a { color: var(--color-text-muted); font-family: var(--font-body); font-size: 0.85rem; }
    .nav-col a:hover { color: var(--color-accent); }
    .footer-identity { display: flex; align-items: center; justify-content: center; gap: var(--space-sm); color: var(--color-decorator); margin-bottom: var(--space-lg); }
    .footer-social { display: flex; justify-content: center; gap: var(--space-lg); margin-bottom: var(--space-md); font-size: 0.78rem; }
    .footer-colophon { font-size: 0.65rem; color: var(--color-text-faint); text-align: center; }

    /* Tweaks panel */
    .tweaks-panel { position: fixed; right: 16px; bottom: 16px; background: var(--color-surface-raised); border: 1px solid var(--color-border-strong); border-radius: 4px; padding: 14px 16px; font-family: var(--font-mono); font-size: 0.75rem; z-index: 1000; max-width: 240px; }
    .tweaks-panel h4 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: lowercase; color: var(--color-text-muted); margin: 0 0 10px; font-weight: 400; }
    .tweaks-panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tweaks-panel button { background: var(--color-bg-subtle); border: 1px solid var(--color-border); color: var(--color-text-muted); border-radius: 3px; padding: 4px 10px; cursor: pointer; font-family: var(--font-mono); font-size: 0.72rem; }
    .tweaks-panel button.active { color: var(--color-accent); border-color: var(--color-accent); }
    .tweaks-panel [hidden] { display: none; }
    .search-notice { max-width: 48rem; margin: 0 auto; padding: 0 var(--layout-padding-mobile); font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="tweaks-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="./Header.jsx"></script>
  <script type="text/babel" src="./Footer.jsx"></script>
  <script type="text/babel" src="./Primitives.jsx"></script>
  <script type="text/babel" src="./Pages.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "colorMode": "light"
    }/*EDITMODE-END*/;

    const App = () => {
      const [path, setPath] = React.useState('/');
      const [activeNote, setActiveNote] = React.useState(null);
      const [activeProject, setActiveProject] = React.useState(null);
      const [theme, setTheme] = React.useState(TWEAK_DEFAULTS.colorMode || 'light');
      const [tweaksOn, setTweaksOn] = React.useState(false);
      const [searchNotice, setSearchNotice] = React.useState(false);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      // Edit mode wiring
      React.useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setTweaksOn(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const persist = (key, val) => {
        try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*'); } catch {}
      };

      const navTo = (p) => { setActiveNote(null); setActiveProject(null); setPath(p); window.scrollTo(0,0); };
      const openNote = (n) => { setActiveNote(n); setPath(`/notes/${n.slug}/`); window.scrollTo(0,0); };
      const openProject = (p) => { setActiveProject(p); setPath(`/projects/${p.slug}/`); window.scrollTo(0,0); };

      // Breadcrumbs
      const crumbs = (() => {
        if (activeNote) return [{label:'home', href:'/'}, {label:'notes', href:'/notes/'}, {label: activeNote.title.toLowerCase(), current:true}];
        if (activeProject) return [{label:'home', href:'/'}, {label:'projects', href:'/projects/'}, {label: activeProject.title.toLowerCase(), current:true}];
        if (path === '/') return [{label:'home', current: true}];
        if (path.startsWith('/notes')) return [{label:'home', href:'/'}, {label:'notes', current:true}];
        if (path.startsWith('/projects')) return [{label:'home', href:'/'}, {label:'projects', current:true}];
        if (path.startsWith('/resume')) return [{label:'home', href:'/'}, {label:'resume', current:true}];
        return [{label:'home', href:'/'}, {label:'404', current:true}];
      })();

      let page;
      if (activeNote) page = <NoteDetail note={activeNote}/>;
      else if (activeProject) page = <ProjectDetail project={activeProject}/>;
      else if (path === '/') page = <HomePage onNav={navTo}/>;
      else if (path === '/notes/') page = <NotesPage onOpenNote={openNote}/>;
      else if (path === '/projects/') page = <ProjectsPage onOpenProject={openProject}/>;
      else if (path === '/resume/') page = <ResumePage/>;
      else page = <NotFoundPage onNav={navTo}/>;

      return (
        <>
          <Header crumbs={crumbs} onNav={navTo} theme={theme} onToggleTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')} onSearch={() => setSearchNotice(true)}/>
          {searchNotice && <div className="search-notice" role="status">search is not wired in this kit</div>}
          <main className="page-content">{page}</main>
          <Footer onNav={navTo}/>
          {tweaksOn && (
            <div className="tweaks-panel">
              <h4>tweaks</h4>
              <div>
                <div style={{color:'var(--color-text-faint)', marginBottom:4}}>mode</div>
                <div className="row">
                  <button className={theme === 'light' ? 'active' : ''} onClick={() => { setTheme('light'); persist('colorMode', 'light'); }}>light</button>
                  <button className={theme === 'dark' ? 'active' : ''} onClick={() => { setTheme('dark'); persist('colorMode', 'dark'); }}>dark</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
