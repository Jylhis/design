<!-- @dsCard group="Patterns" viewport="620x320" name="Terminal listing" subtitle="ls-style project index" -->
<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Terminal Listing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../card-chrome.css">
<style>
  body { padding: 18px 22px; color: var(--color-text); font-family: var(--font-mono); font-size: var(--type-scale-8); }
  .prompt { color: var(--color-text-muted); margin-bottom: 10px; }
  .prompt .char { color: var(--color-accent); margin-right: 6px; }
  .entry { background: var(--color-bg-subtle); border: 1px solid transparent; border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 8px; }
  .entry:hover, .entry.hover { border-color: var(--color-border); background: var(--color-surface); }
  .head { display: flex; gap: 14px; align-items: baseline; font-size: var(--type-scale-9); margin-bottom: 4px; flex-wrap: wrap; }
  .perms { color: var(--color-text-faint); }
  .name { color: var(--color-accent); font-weight: 600; font-size: var(--type-scale-5); }
  .date { color: var(--color-text-faint); margin-left: auto; }
  .desc { font-family: var(--font-body); font-size: var(--type-scale-6); color: var(--color-text); margin: 0 0 6px; }
  .tree { color: var(--color-text-faint); font-size: var(--type-scale-9); }
  .tree a { color: var(--color-text-muted); text-decoration: none; }
</style></head>
<body>
  <div class="prompt"><span class="char" aria-hidden="true">$</span>ls -la ~/projects/</div>
  <div class="entry hover">
    <div class="head"><span class="perms">drwxr-xr-x</span><span class="name">NixOS Configuration</span><span class="date">Jul 17, 2024</span></div>
    <p class="desc">Personal spin of Omarchy with NixOS.</p>
    <div class="tree">├── <a>github</a><br>└── <a>demo</a></div>
  </div>
  <div class="entry">
    <div class="head"><span class="perms">dr-xr-xr-x</span><span class="name">nixpkgs</span><span class="date">Mar 04, 2023</span></div>
    <p class="desc">Contributed packages and modules upstream.</p>
  </div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/tweaks-panel.js"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/ds-tweaks.js"></script>
</body></html>
