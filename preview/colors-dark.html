<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Palette — Dark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: #0d0f14; }
  body { padding: 18px 20px; font-family: var(--font-mono); font-size: var(--type-scale-9); color: #d6dae2; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border: 1px solid #3a4150; border-radius: 3px; overflow: hidden; }
  .chip { height: 42px; }
  .meta { padding: 5px 7px; background: #1b1f28; }
  .name { font-weight: 600; color: #f2f4f8; font-size: var(--type-scale-9); }
  .hex { color: #656b76; font-size: var(--type-scale-9); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0d0f14"></div><div class="meta"><div class="name">bg</div><div class="hex">#0D0F14</div></div></div>
    <div class="sw"><div class="chip" style="background:#14171e"></div><div class="meta"><div class="name">bg-subtle</div><div class="hex">#14171E</div></div></div>
    <div class="sw"><div class="chip" style="background:#1b1f28"></div><div class="meta"><div class="name">surface</div><div class="hex">#1B1F28</div></div></div>
    <div class="sw"><div class="chip" style="background:#232833"></div><div class="meta"><div class="name">raised</div><div class="hex">#232833</div></div></div>
    <div class="sw"><div class="chip" style="background:#d6dae2"></div><div class="meta"><div class="name">text</div><div class="hex">#D6DAE2</div></div></div>
    <div class="sw"><div class="chip" style="background:#e0a33a"></div><div class="meta"><div class="name">accent</div><div class="hex">#E0A33A</div></div></div>
  </div>
</body></html>
