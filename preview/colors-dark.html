<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Palette — Dark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: #1a1714; }
  body { padding: 18px 20px; font-family: var(--font-mono); font-size: 11px; color: #e8e0d4; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border: 1px solid #3d3830; border-radius: 3px; overflow: hidden; }
  .chip { height: 42px; }
  .meta { padding: 5px 7px; background: #2a2520; }
  .name { font-weight: 600; color: #f0eae0; font-size: 10px; }
  .hex { color: #6b6157; font-size: 9.5px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1a1714"></div><div class="meta"><div class="name">bg</div><div class="hex">#1A1714</div></div></div>
    <div class="sw"><div class="chip" style="background:#242019"></div><div class="meta"><div class="name">bg-subtle</div><div class="hex">#242019</div></div></div>
    <div class="sw"><div class="chip" style="background:#2a2520"></div><div class="meta"><div class="name">surface</div><div class="hex">#2A2520</div></div></div>
    <div class="sw"><div class="chip" style="background:#363230"></div><div class="meta"><div class="name">raised</div><div class="hex">#363230</div></div></div>
    <div class="sw"><div class="chip" style="background:#e8e0d4"></div><div class="meta"><div class="name">text</div><div class="hex">#E8E0D4</div></div></div>
    <div class="sw"><div class="chip" style="background:#e89b5e"></div><div class="meta"><div class="name">accent</div><div class="hex">#E89B5E</div></div></div>
  </div>
</body></html>
