<!-- @dsCard group="Color" viewport="540x340" name="Syntax" subtitle="colour, weight and style — the weight ladder carries meaning" -->
<!doctype html>
<html lang="en" data-mode="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Palette — Syntax</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../card-chrome.css">
<style>
  body { padding: 18px 20px; font-family: var(--font-mono); font-size: var(--type-scale-9); color: var(--color-text); }
  .code { background: var(--color-code-bg); border: 1px solid var(--color-code-border); border-radius: var(--radius-lg); padding: 14px 16px; line-height: 1.7; font-size: var(--type-scale-8); overflow-x: auto; }
  .legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; color: var(--color-text-faint); font-size: var(--type-scale-9); }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 1px; vertical-align: middle; }
</style></head>
<body>
  <div class="code">
<span class="ds-syn-comment">// connect to the drip, quietly.</span>
<span class="ds-syn-keyword">const</span> <span class="ds-syn-function">connect</span> = <span class="ds-syn-keyword">async</span> (<span class="ds-syn-variable">host</span>: <span class="ds-syn-type">string</span>) =&gt; {
  <span class="ds-syn-keyword">const</span> <span class="ds-syn-variable">port</span>: <span class="ds-syn-type">number</span> = <span class="ds-syn-number">8080</span>;
  <span class="ds-syn-docstring">/** returns the open socket */</span>
  <span class="ds-syn-keyword">return</span> <span class="ds-syn-builtin">globalThis</span>.<span class="ds-syn-function">fetch</span>(<span class="ds-syn-string">`https://${host}:${port}`</span>);
};
  </div>
  <div class="legend" id="legend"></div>
<script>
const ROLES = ["keyword","function","type","string","builtin","number","variable","docstring","comment"];
const root = document.documentElement, legend = document.getElementById("legend");
function render(){
  const cs = getComputedStyle(root);
  legend.innerHTML = ROLES.map(r => {
    const w = cs.getPropertyValue("--syntax-" + r + "-weight").trim();
    const st = cs.getPropertyValue("--syntax-" + r + "-style").trim();
    const em = [w === "700" ? "bold" : "", st === "italic" ? "italic" : ""].filter(Boolean).join(" ");
    return `<span><span style="background:var(--color-syntax-${r})"></span>${r}${em ? " · " + em : ""}</span>`;
  }).join("");
}
// Mode comes from the Tweaks panel, which sets it on <html>.
new MutationObserver(render).observe(root, { attributeFilter: ["data-mode","data-density"] });
render();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/tweaks-panel.js"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/ds-tweaks.js"></script>
</body></html>
