<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 20px 22px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--color-text); }
  .label { font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .search { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 3px; padding: 0.35rem 0.6rem; color: var(--color-text-muted); font-family: inherit; font-size: 0.72rem; display: inline-flex; gap: 0.4rem; align-items: center; cursor: pointer; transition: border-color var(--transition-fast), color var(--transition-fast); }
  .search.hover { color: var(--color-accent); border-color: var(--color-accent); }
  .kbd { font-size: 0.65rem; padding: 0.1rem 0.35rem; border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-bg); color: var(--color-text-faint); }
  .theme { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 50%; width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; color: var(--color-text-muted); font-size: 0.9rem; transition: border-color var(--transition-fast), color var(--transition-fast); }
  .theme.hover { color: var(--color-accent); border-color: var(--color-accent); }
  .search:active,
  .theme:active { color: var(--color-accent-hover); border-color: var(--color-accent-hover); }
  .ghost { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; color: var(--color-accent); background: none; border: none; padding: 0; cursor: pointer; transition: color var(--transition-fast); }
  .ghost:active { color: var(--color-accent-hover); }
</style></head>
<body>
  <span class="label">search trigger</span>
  <div class="row">
    <button class="search"><span>search</span><kbd class="kbd">/</kbd></button>
    <button class="search hover"><span>search</span><kbd class="kbd">/</kbd></button>
  </div>
  <span class="label">theme toggle (the only circle in the system)</span>
  <div class="row">
    <span class="theme" aria-hidden="true">☾</span><span class="theme hover" aria-hidden="true">☾</span><span class="theme" aria-hidden="true">☀</span>
  </div>
  <span class="label">ghost link-button</span>
  <div class="row"><button class="ghost">GitHub →</button> <button class="ghost">rss feed</button></div>
</body></html>
