<!-- @dsCard group="Foundations" viewport="520x300" name="Maker's mark" subtitle="jy ❯ — pure type, one per surface" -->
<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal mark</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../card-chrome.css">
<style>
  body { padding: 20px 22px; color: var(--color-text); font-family: var(--font-mono); font-size: var(--type-scale-9); }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .mark { font-size: var(--type-scale-2); font-weight: 600; color: var(--color-text-heading); letter-spacing: 0.01em; }
  .mark .chevron { color: var(--color-accent); }
  /* Negative mode: brand is near-pure ink, so the chevron drops a lightness
     tier — the caret keeps full cursor ink and the two read as separate marks.
     Matches .ds-mark__chevron. */
  [data-mode="dark"] .chevron { color: var(--color-text-muted); }
  .label { margin: 0; }
  .usage { margin-top: 18px; display: grid; gap: 6px; font-size: var(--type-scale-8); color: var(--color-text-muted); }
  .usage .chevron { color: var(--color-accent); }
  .rules { margin-top: 16px; border-top: 1px dashed var(--color-decorator); padding-top: 10px; font-size: var(--type-scale-9); color: var(--color-text-faint); letter-spacing: 0.03em; }
</style></head>
<body>
  <div class="row">
    <div>
      <div class="mark">jy&thinsp;<span class="chevron">❯</span><span class="ds-caret" aria-hidden="true"></span></div>
      <div class="label">the mark — live surfaces</div>
    </div>
    <div>
      <div class="mark">jy&thinsp;<span class="chevron">❯</span></div>
      <div class="label">static — print &amp; tty</div>
    </div>
  </div>
  <div class="usage">
    <span>footer sign-off: &nbsp;jy <span class="chevron">❯</span> built by hand, no tracking</span>
    <span>contact line: &nbsp;jy <span class="chevron">❯</span> say hello</span>
  </div>
  <p class="rules">once per surface · chevron bronze · caret never twice on one page · pure type, renders everywhere</p>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/tweaks-panel.js"></script>
<script type="text/babel" data-presets="env,react" src="../scripts/ds-tweaks.js"></script>
</body></html>
