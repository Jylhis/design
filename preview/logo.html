<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Logo & Maker's Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 20px 22px; color: var(--color-text); font-family: "JetBrains Mono", monospace; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 24px; }
  .mark { color: var(--color-accent); width: 52px; height: 52px; }
  .mark svg { width: 100%; height: 100%; }
  .wm-group { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: 3px; }
  .wm-group .mk { width: 24px; height: 24px; color: var(--color-accent); }
  .wm-text { font-size: 12px; font-weight: 600; color: var(--color-text-heading); letter-spacing: 0.02em; }
  .label { font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 8px; }
</style></head>
<body>
  <div class="row">
    <div>
      <div class="mark">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
          <line x1="16" y1="2" x2="16" y2="30"/>
          <line x1="16" y1="6" x2="26" y2="14"/>
          <line x1="16" y1="6" x2="6" y2="14"/>
          <line x1="6" y1="14" x2="16" y2="22" stroke-width="2"/>
          <line x1="26" y1="14" x2="16" y2="22" stroke-width="2"/>
          <line x1="8" y1="22" x2="16" y2="14" stroke-width="1.5"/>
          <line x1="24" y1="22" x2="16" y2="14" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="label">maker's mark</div>
    </div>
    <div>
      <div class="wm-group">
        <span class="mk">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
            <line x1="16" y1="2" x2="16" y2="30"/>
            <line x1="16" y1="6" x2="26" y2="14"/><line x1="16" y1="6" x2="6" y2="14"/>
            <line x1="6" y1="14" x2="16" y2="22" stroke-width="2"/>
            <line x1="26" y1="14" x2="16" y2="22" stroke-width="2"/>
            <line x1="8" y1="22" x2="16" y2="14" stroke-width="1.5"/>
            <line x1="24" y1="22" x2="16" y2="14" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="wm-text">markus jylhänkangas</span>
      </div>
      <div class="label">wordmark lockup</div>
    </div>
  </div>
</body></html>
