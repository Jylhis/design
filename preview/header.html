<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Header & Breadcrumb</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 16px 20px; color: var(--color-text); font-family: var(--font-mono); font-size: var(--type-scale-8); }
  .hdr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
  .wm { display: flex; gap: 8px; align-items: center; }
  .mk { width: 22px; height: 22px; color: var(--color-accent); }
  .wm-text { font-size: var(--type-scale-8); font-weight: 600; color: var(--color-text-heading); letter-spacing: 0.02em; }
  .right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .crumb { font-size: var(--type-scale-9); color: var(--color-text-muted); }
  .crumb a { color: var(--color-text-muted); text-decoration: none; }
  .crumb .sep { opacity: 0.5; margin: 0 0.4em; }
  .crumb .current { color: var(--color-text); }
  .search { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 3px; padding: 0.3rem 0.6rem; font-size: var(--type-scale-9); color: var(--color-text-muted); display: inline-flex; gap: 0.4rem; align-items: center; }
  .kbd { font-size: var(--type-scale-9); padding: 0.1rem 0.35rem; border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-bg); color: var(--color-text-faint); }
  .theme { background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: 50%; width: 1.85rem; height: 1.85rem; display: inline-flex; align-items: center; justify-content: center; color: var(--color-text-muted); }
</style></head>
<body>
  <div class="hdr">
    <div class="wm">
      <span class="mk"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><line x1="16" y1="2" x2="16" y2="30"/><line x1="16" y1="6" x2="26" y2="14"/><line x1="16" y1="6" x2="6" y2="14"/><line x1="6" y1="14" x2="16" y2="22" stroke-width="2"/><line x1="26" y1="14" x2="16" y2="22" stroke-width="2"/></svg></span>
      <span class="wm-text">markus jylhänkangas</span>
    </div>
    <div class="right">
      <nav class="crumb"><a>home</a><span class="sep" aria-hidden="true">▸</span><a>notes</a><span class="sep" aria-hidden="true">▸</span><span class="current">linux toolbox</span></nav>
      <span class="search">search <kbd class="kbd">/</kbd></span>
      <span class="theme" aria-hidden="true">☾</span>
    </div>
  </div>
</body></html>
