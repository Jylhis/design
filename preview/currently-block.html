<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Currently Block</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 22px 24px; color: var(--color-text); font-family: "Literata", "Literata", Georgia, serif; }
  .box { background: var(--color-bg-subtle); border-left: 3px solid var(--color-accent); border-radius: 0 4px 4px 0; padding: 18px 22px; max-width: 520px; }
  .label { font-family: "JetBrains Mono", "JetBrains Mono", monospace; font-size: 0.8rem; text-transform: lowercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin: 0 0 10px; font-weight: 400; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { position: relative; padding: 0.3rem 0 0.3rem 1.5em; font-size: 0.95rem; }
  li::before { content: '›'; position: absolute; left: 0; color: var(--color-accent); font-family: "JetBrains Mono", "JetBrains Mono", monospace; }
  a { color: var(--color-accent); text-decoration: none; }
</style></head>
<body>
  <div class="box">
    <h3 class="label">// currently</h3>
    <ul>
      <li>building robotics and DevOps platforms at <a>Hexagon</a> in Zürich</li>
      <li>rewriting this site with Astro 5.x and a new design system</li>
    </ul>
  </div>
</body></html>
