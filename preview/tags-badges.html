<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Tags & Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 20px 22px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--color-text); }
  .label { font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag { font-size: 0.78rem; padding: 0.15em 0.55em; border-radius: 3px; background: var(--color-bg-subtle); border: 1px solid var(--color-border); color: var(--color-text-muted); }
  .tag.hover { color: var(--color-accent); border-color: var(--color-accent); }
  .status { font-size: 0.7rem; padding: 0.1em 0.5em; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .s-active   { color: var(--color-status-ok);   background: rgba(0,104,0,0.12);   border: 1px solid var(--color-status-ok); }
  .s-archived { color: #6b5f54; background: var(--color-bg-subtle); border: 1px solid var(--color-border); }
  .s-exp      { color: var(--color-syntax-keyword); background: rgba(83,26,182,0.12); border: 1px solid var(--color-syntax-keyword); }
  .s-contrib  { color: var(--color-status-info); background: rgba(0,49,169,0.12); border: 1px solid var(--color-status-info); }
</style></head>
<body>
  <span class="label">tag chips · hover in last</span>
  <div class="tags">
    <span class="tag">nix</span><span class="tag">devops</span><span class="tag">emacs</span><span class="tag">cli</span><span class="tag hover">linux</span>
  </div>
  <span class="label">project status</span>
  <div class="tags">
    <span class="status s-active">active</span>
    <span class="status s-archived">archived</span>
    <span class="status s-exp">experimental</span>
    <span class="status s-contrib">contributed</span>
  </div>
</body></html>
