<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Palette — Text & Borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 18px 20px; font-family: var(--font-mono); font-size: var(--type-scale-9); color: var(--color-text); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(7rem, 100%), 1fr)); gap: 10px; }
  .sw { border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-surface-raised); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .dot { width: 100%; height: 32px; border-radius: 2px; }
  .name { font-weight: 600; color: var(--color-text-heading); }
  .hex { color: var(--color-text-faint); font-size: var(--type-scale-9); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="dot" style="background:#12141a"></div><div class="name">text-heading</div><div class="hex">#12141A</div></div>
    <div class="sw"><div class="dot" style="background:#23262e"></div><div class="name">text</div><div class="hex">#23262E</div></div>
    <div class="sw"><div class="dot" style="background:#565a63"></div><div class="name">text-muted</div><div class="hex">#565A63</div></div>
    <div class="sw"><div class="dot" style="background:#878c95"></div><div class="name">text-faint</div><div class="hex">#878C95</div></div>
    <div class="sw"><div class="dot" style="background:#aab4c0"></div><div class="name">border-strong</div><div class="hex">#AAB4C0</div></div>
    <div class="sw"><div class="dot" style="background:#cfd6de"></div><div class="name">border</div><div class="hex">#CFD6DE</div></div>
  </div>
</body></html>
