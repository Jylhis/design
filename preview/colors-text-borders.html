<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Palette — Text & Borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 18px 20px; font-family: var(--font-mono); font-size: 11px; color: var(--color-text); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-surface-raised); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .dot { width: 100%; height: 32px; border-radius: 2px; }
  .name { font-weight: 600; color: var(--color-text-heading); }
  .hex { color: var(--color-text-faint); font-size: 9.5px; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="dot" style="background:#1e1b18"></div><div class="name">text-heading</div><div class="hex">#1E1B18</div></div>
    <div class="sw"><div class="dot" style="background:#2c2825"></div><div class="name">text</div><div class="hex">#2C2825</div></div>
    <div class="sw"><div class="dot" style="background:#6b5f54"></div><div class="name">text-muted</div><div class="hex">#6B5F54</div></div>
    <div class="sw"><div class="dot" style="background:#8a7f72"></div><div class="name">text-faint</div><div class="hex">#8A7F72</div></div>
    <div class="sw"><div class="dot" style="background:#b0a898"></div><div class="name">border-strong</div><div class="hex">#B0A898</div></div>
    <div class="sw"><div class="dot" style="background:#d5cec4"></div><div class="name">border</div><div class="hex">#D5CEC4</div></div>
  </div>
</body></html>
