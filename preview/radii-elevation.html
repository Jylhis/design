<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Radii & Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 20px 22px; color: var(--color-text); font-family: var(--font-mono); font-size: 10.5px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { background: var(--color-surface-raised); border: 1px solid var(--color-border); padding: 12px; text-align: center; }
  .tok { color: var(--color-text-heading); font-weight: 600; font-size: 11px; }
  .val { color: var(--color-text-faint); margin-top: 2px; }
  .shape { width: 44px; height: 44px; background: var(--color-accent-subtle); border: 1px solid var(--color-accent); margin: 6px auto; }
  .note { grid-column: 1 / -1; padding: 10px 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); font-family: var(--font-body); font-size: 12px; font-style: italic; line-height: 1.5; }
</style></head>
<body>
  <div class="grid">
    <div class="card"><div class="shape" style="border-radius:2px"></div><div class="tok">radius-xs</div><div class="val">2px</div></div>
    <div class="card"><div class="shape" style="border-radius:3px"></div><div class="tok">radius-sm</div><div class="val">3px</div></div>
    <div class="card"><div class="shape" style="border-radius:4px"></div><div class="tok">radius-md</div><div class="val">4px</div></div>
    <div class="card"><div class="shape" style="border-radius:50%"></div><div class="tok">radius-pill</div><div class="val">circle only</div></div>
    <div class="note">No shadow system. Elevation comes from bg → bg-subtle → surface → surface-raised steps plus 1px borders. Deliberate flat-paper aesthetic.</div>
  </div>
</body></html>
