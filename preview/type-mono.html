<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Type — Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background: var(--color-bg); }
  body { padding: 20px 22px; color: var(--color-text); font-family: "JetBrains Mono", monospace; font-size: 0.9rem; }
  .tag { font-size: 10px; color: var(--color-text-faint); letter-spacing: 0.04em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .role { font-size: 0.85rem; color: var(--color-text-muted); letter-spacing: 0.02em; margin-bottom: 14px; }
  .man  { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; color: var(--color-text-faint); text-transform: uppercase; margin-bottom: 14px; }
  .meta { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 14px; }
  .kbd { font-size: 0.7rem; padding: 0.1rem 0.35rem; border: 1px solid var(--color-border); border-radius: 3px; background: var(--color-bg-subtle); color: var(--color-text-faint); }
</style></head>
<body>
  <span class="tag">role line · 0.85 muted</span>
  <div class="role">senior software engineer · zürich, ch</div>
  <span class="tag">man-page label · 0.85 uppercase 0.08em</span>
  <div class="man">CRAFT(7)</div>
  <span class="tag">meta · 0.8 muted</span>
  <div class="meta">Oct 19, 2025 · 6 min read</div>
  <span class="tag">kbd</span>
  <div><kbd class="kbd">/</kbd> &nbsp; <kbd class="kbd">⌘K</kbd> &nbsp; <kbd class="kbd">esc</kbd></div>
</body></html>
