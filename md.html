<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jylhis Design System — Docs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Markdown documentation rendered with the Jylhis design system tokens.">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="stylesheet" href="./colors_and_type.css">
<style>
  :root { --maxw: 72ch; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--color-bg); min-height: 100vh; }
  .skip-link { position: absolute; left: 24px; top: 16px; z-index: var(--z-skip); transform: translateY(-160%); padding: 8px 12px; background: var(--color-bg); color: var(--color-accent); border: 1px solid var(--color-accent); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 0.8rem; text-decoration: none; }
  .skip-link:focus-visible { transform: translateY(0); outline: 2px solid var(--color-accent); outline-offset: 2px; }
  main { max-width: var(--maxw); margin: 0 auto; padding: 56px 24px 120px; }

  header.hero { border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-lg); margin-bottom: var(--space-xl); }
  header.hero .crumb { font-family: var(--font-mono); font-size: 0.76rem; color: var(--color-text-faint); letter-spacing: 0.04em; margin: 0 0 10px; }
  header.hero .crumb a { color: var(--color-accent); text-decoration: none; }
  header.hero .crumb a:hover { color: var(--color-accent-hover); }
  header.hero .crumb .sep { color: var(--color-decorator); margin: 0 6px; }
  header.hero .path { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-text-muted); }

  .toolbar { position: fixed; top: 24px; right: 24px; z-index: var(--z-sticky); display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; }
  .toolbar button, .toolbar a.view-raw { font: inherit; cursor: pointer; background: var(--color-bg-subtle); color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 6px 12px; transition: border-color var(--transition-fast); text-decoration: none; }
  .toolbar button:hover, .toolbar a.view-raw:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .toolbar button:focus-visible, .toolbar a.view-raw:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  article { font-family: var(--font-body); font-size: 1.125rem; line-height: 1.65; color: var(--color-text); }
  @media (max-width: 860px) { article { font-size: 1rem; } }

  article h1, article h2, article h3, article h4, article h5, article h6 {
    font-family: var(--font-mono);
    color: var(--color-text-heading);
    letter-spacing: -0.005em;
    line-height: 1.25;
    margin: var(--space-xl) 0 var(--space-sm);
  }
  article h1 { font-size: 2rem; font-weight: 700; margin-top: 0; }
  article h2 { font-size: 1.35rem; font-weight: 700; padding-top: var(--space-md); border-top: 1px solid var(--color-border); }
  article h2::before { content: "// "; color: var(--color-accent); font-weight: 400; }
  article h3 { font-size: 1.1rem; font-weight: 600; color: var(--color-text); }
  article h4 { font-size: 0.95rem; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  article h5, article h6 { font-size: 0.85rem; font-weight: 600; color: var(--color-text-muted); }

  article p { margin: 0 0 var(--space-md); }
  article a { color: var(--color-accent); text-decoration: underline; text-decoration-color: var(--color-accent-subtle); text-underline-offset: 3px; }
  article a:hover { color: var(--color-accent-hover); text-decoration-color: var(--color-accent); }
  article a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 2px; }

  article strong { color: var(--color-text-heading); font-weight: 600; }
  article em { color: var(--color-text); }

  article hr { border: 0; border-top: 1px dashed var(--color-decorator); margin: var(--space-xl) 0; }

  article blockquote {
    margin: var(--space-md) 0;
    padding: var(--space-sm) var(--space-md);
    border: var(--border-hairline) solid var(--color-border);
    background: var(--color-bg-subtle);
    color: var(--color-text-muted);
    border-radius: var(--radius-sm);
  }
  article blockquote p:last-child { margin-bottom: 0; }

  article ul, article ol { padding-left: 1.5em; margin: 0 0 var(--space-md); }
  article li { margin: 0.2em 0; }
  article li::marker { color: var(--color-text-faint); }
  article ul ul, article ol ol, article ul ol, article ol ul { margin-bottom: 0; }

  article input[type="checkbox"] { accent-color: var(--color-accent); margin-right: 0.4em; }

  article :not(pre) > code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--color-code-bg);
    color: var(--color-code-text);
    border: 1px solid var(--color-code-border);
    border-radius: var(--radius-sm);
    padding: 0.1em 0.35em;
  }

  article pre {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.55;
    background: var(--color-code-bg);
    color: var(--color-code-text);
    border: 1px solid var(--color-code-border);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
    overflow-x: auto;
    margin: 0 0 var(--space-md);
  }
  article pre code { background: transparent; border: 0; padding: 0; font-size: inherit; color: inherit; }

  article table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 var(--space-lg);
    font-size: 0.95rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  article th, article td {
    padding: 0.5em 0.75em;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--color-border);
  }
  article th {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--color-text-faint);
    text-transform: uppercase;
    background: var(--color-bg-subtle);
    border-bottom: 1px solid var(--color-border-strong);
  }
  article tr:last-child td { border-bottom: 0; }
  article tbody tr:hover { background: var(--color-bg-subtle); }
  article td code { white-space: nowrap; }

  article img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }

  .error {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    color: var(--color-status-err);
    background: color-mix(in srgb, var(--color-status-err) 10%, transparent);
    border: var(--border-hairline) solid var(--color-status-err);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
  }
  .loading {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--color-text-faint);
  }

  footer { margin-top: var(--space-3xl); padding-top: var(--space-lg); border-top: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-muted); text-align: center; }
  footer a { color: var(--color-accent); text-decoration: none; }
  footer a:hover { color: var(--color-accent-hover); }
</style>
<script>
  try {
    var s = localStorage.getItem("jylhis-theme");
    var m = s || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (m === "dark") document.documentElement.dataset.theme = "dark";
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<div class="toolbar">
  <a class="view-raw" id="view-raw" href="#" title="View raw markdown source">raw</a>
  <span id="theme-label">sheet</span>
  <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">☾</button>
</div>

<main>
  <header class="hero">
    <p class="crumb">
      <a href="./index.html">jylhis design system</a>
      <span class="sep" aria-hidden="true">/</span>
      <span id="crumb-current">docs</span>
    </p>
    <p class="path" id="src-path"></p>
  </header>

  <article id="content" class="loading">loading…</article>

  <footer>
    ──────── <a href="./index.html">back to index</a> · <a href="./tokens.md" id="footer-raw">view raw</a> ────────
  </footer>
</main>

<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";
  import { gfmHeadingId } from "https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@3.1.3/+esm";
  import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.es.mjs";

  // Accept only relative paths ending in .md, no protocol, no traversal above root.
  const params = new URLSearchParams(location.search);
  const rawSrc = params.get("src") || "README.md";
  const safe = /^(?!\/)(?!.*\.\.)[A-Za-z0-9_./-]+\.md$/.test(rawSrc) ? rawSrc : "README.md";

  const content = document.getElementById("content");
  const crumb = document.getElementById("crumb-current");
  const srcPath = document.getElementById("src-path");
  const viewRaw = document.getElementById("view-raw");
  const footerRaw = document.getElementById("footer-raw");

  const basename = safe.split("/").pop();
  crumb.textContent = basename;
  srcPath.textContent = "./" + safe;
  viewRaw.href = "./" + safe;
  footerRaw.href = "./" + safe;
  document.title = basename + " · Jylhis Design System";

  // Resolve a relative href against the markdown file's own directory.
  const baseDir = safe.includes("/") ? safe.slice(0, safe.lastIndexOf("/") + 1) : "";
  const resolveRel = (href) => {
    // Keep absolute URLs, anchors, mailto, protocol-relative unchanged.
    if (/^([a-z]+:|\/\/|#|mailto:|tel:)/i.test(href)) return null;
    // Resolve relative to baseDir, collapsing . and .. segments.
    const parts = (baseDir + href).split("/");
    const out = [];
    for (const p of parts) {
      if (p === "" || p === ".") continue;
      if (p === "..") { out.pop(); continue; }
      out.push(p);
    }
    // Preserve trailing slash if input had one.
    return out.join("/") + (href.endsWith("/") ? "/" : "");
  };

  marked.use(gfmHeadingId(), {
    gfm: true,
    breaks: false,
  });

  try {
    const res = await fetch("./" + safe, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const md = await res.text();
    const dirty = marked.parse(md);
    const clean = DOMPurify.sanitize(dirty, { USE_PROFILES: { html: true } });

    // Render into a detached container so we can rewrite links before mount.
    const tmp = document.createElement("div");
    tmp.innerHTML = clean;

    for (const a of tmp.querySelectorAll("a[href]")) {
      const href = a.getAttribute("href");
      const resolved = resolveRel(href);
      if (resolved === null) continue;                  // external / anchor
      if (/\.md(#.*)?$/i.test(href)) {
        // Route sibling markdown through this viewer.
        const [path, hash = ""] = resolved.split("#");
        a.setAttribute("href", "./md.html?src=" + encodeURIComponent(path) + (hash ? "#" + hash : ""));
      }
      // other relative links are left alone — they point at real files in the site
    }

    content.className = "";
    content.replaceChildren(...tmp.childNodes);
  } catch (err) {
    content.className = "error";
    content.textContent = "Failed to load ./" + safe + " — " + err.message;
  }
</script>

<script>
  const doc = document.documentElement;
  const label = document.getElementById("theme-label");
  const btn = document.getElementById("theme-toggle");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const safeGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  const apply = (mode, persist = true) => {
    if (mode === "dark") { doc.dataset.theme = "dark"; label.textContent = "field"; btn.textContent = "☀"; }
    else { delete doc.dataset.theme; label.textContent = "sheet"; btn.textContent = "☾"; }
    if (persist) safeSet("jylhis-theme", mode);
  };

  const saved = safeGet("jylhis-theme");
  apply(saved ?? (mq.matches ? "dark" : "light"), saved !== null);
  btn.addEventListener("click", () => apply(doc.dataset.theme === "dark" ? "light" : "dark"));
  mq.addEventListener("change", (e) => { if (!safeGet("jylhis-theme")) apply(e.matches ? "dark" : "light", false); });
</script>

</body>
</html>
