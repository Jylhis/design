name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# contents:write so the deploy step can push the built site to gh-pages.
permissions:
  contents: write

# Serialize every write to gh-pages across BOTH this workflow and preview.yml
# so a production deploy and a PR-preview deploy never race on the branch.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Assemble site
        run: bash scripts/assemble-pages.sh

      # Publish _site to the ROOT of gh-pages using only git + GitHub's own
      # token — no third-party deploy action. PR previews under pr-preview/
      # (see preview.yml) are preserved across production redeploys.
      - name: Deploy to gh-pages root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages "$remote" "$tmp" || {
            git clone --depth 1 "$remote" "$tmp"
            git -C "$tmp" checkout --orphan gh-pages
            git -C "$tmp" rm -rf . >/dev/null 2>&1 || true
          }
          # Replace everything except .git and the live PR previews.
          find "$tmp" -mindepth 1 -maxdepth 1 ! -name .git ! -name pr-preview -exec rm -rf {} +
          cp -a _site/. "$tmp"/
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA} to Pages root" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin gh-pages && exit 0
            echo "push rejected, syncing with remote (attempt $i)"
            git fetch origin gh-pages && git rebase origin/gh-pages
            sleep $((i * 2))
          done
          echo "failed to push after retries" >&2; exit 1
