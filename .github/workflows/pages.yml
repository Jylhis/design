name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deploy the production site to the root of the gh-pages branch.
# PR previews (see preview.yml) live under pr-preview/ on the same branch,
# so both share a single GitHub Pages site served from that branch.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Assemble site
        run: bash scripts/assemble-pages.sh

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: _site
          branch: gh-pages
          # Wipe stale production files, but never touch live PR previews.
          clean: true
          clean-exclude: |
            pr-preview/
