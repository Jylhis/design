name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# contents:write to push the built preview to gh-pages; pull-requests:write
# so the action can post/update the preview-link comment on the PR.
permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    name: build and deploy PR preview
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and cannot push to gh-pages, so skip them
    # rather than fail. Previews are published for same-repo branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: github.event.action != 'closed'

      # No build needed on close: the action only removes the stale preview dir.
      - name: Assemble site
        if: github.event.action != 'closed'
        run: bash scripts/assemble-pages.sh

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # auto: deploy on open/reopen/synchronize, remove on close.
          action: auto
