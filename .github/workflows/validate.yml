name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: token sync & contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate tokens, CSS custom properties, and contrast
        run: node scripts/validate-tokens.mjs
