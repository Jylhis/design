name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: token sync & contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check generated files match tokens.json
        run: bun scripts/generate.mjs --check
      - name: Validate token schema and contrast ratios
        run: bun scripts/validate-tokens.mjs
